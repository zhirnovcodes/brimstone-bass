<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Brimstone Bass dev</title>
        <style>
            body {
                margin: 0;
                padding: 16px;
                background: #fff;
                color: #000;
                font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
            }
            .bar {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
                margin-bottom: 12px;
            }
            .bar button,
            .bar input,
            #keys button {
                font: inherit;
                border: 1px solid #000;
                border-radius: 0;
                background: #fff;
                color: #000;
                padding: 3px 8px;
            }
            .bar button[aria-pressed='true'] {
                background: #000;
                color: #fff;
            }
            input[type='number'] {
                width: 64px;
            }
            #meter {
                width: 160px;
                height: 10px;
                border: 1px solid #000;
                position: relative;
            }
            #meter > div {
                position: absolute;
                inset: 0 auto 0 0;
                background: #000;
                width: 0;
            }
            #plugin {
                width: 260px;
                min-height: 306px;
                border: 1px solid #000;
                margin-bottom: 12px;
            }
            #keys {
                display: flex;
                height: 70px;
                margin-bottom: 12px;
                user-select: none;
            }
            #keys button {
                width: 34px;
                height: 70px;
                padding: 0;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                padding-bottom: 4px;
            }
            #keys button.black {
                height: 44px;
                background: #000;
                color: #fff;
                margin: 0 -10px;
                z-index: 1;
                width: 20px;
            }
            #keys button.down {
                outline: 3px solid #000;
                outline-offset: -6px;
            }
            #keys button.black.down {
                outline-color: #fff;
            }
            #main {
                display: flex;
                gap: 16px;
                align-items: flex-start;
            }
            #presets {
                border: 1px solid #000;
                padding: 8px;
                width: 240px;
            }
            #presets h2 {
                font: inherit;
                font-weight: bold;
                margin: 0 0 6px;
            }
            #presets input,
            #presets select,
            #presets button {
                font: inherit;
                border: 1px solid #000;
                border-radius: 0;
                background: #fff;
                color: #000;
            }
            #preset-name {
                width: 100%;
                box-sizing: border-box;
                padding: 3px 6px;
                margin-bottom: 6px;
            }
            #preset-list {
                width: 100%;
                height: 180px;
                margin-bottom: 6px;
            }
            #presets .buttons {
                display: flex;
                gap: 6px;
            }
            #presets button {
                padding: 3px 8px;
            }
            #presets p {
                margin: 6px 0 0;
                color: #555;
            }
            #log {
                height: 120px;
                overflow: auto;
                border: 1px solid #000;
                padding: 4px 6px;
                white-space: pre;
            }
        </style>
    </head>
    <body>
        <div class="bar">
            <button id="start">Start audio</button>
            <button id="play" aria-pressed="false" disabled>Play</button>
            <label>BPM <input id="bpm" type="number" min="20" max="300" value="120" /></label>
            <span>Octave C<span id="octave">1</span> (Z / X)</span>
            <div id="meter" title="Output peak"><div></div></div>
            <span id="voices">voices 0</span>
            <button id="roundtrip" disabled>State round-trip</button>
            <button id="panic" disabled>All off</button>
        </div>
        <div id="keys" aria-label="Keyboard: A W S E D F T G Y H U J K"></div>
        <div id="main">
            <div id="plugin"></div>
            <section id="presets" aria-label="Plugin presets (localhost only)">
                <h2>Presets: presets/ folder</h2>
                <label>NAME <input id="preset-name" maxlength="16" spellcheck="false" autocomplete="off" /></label>
                <select id="preset-list" size="10" aria-label="Presets in presets/"></select>
                <div class="buttons">
                    <button id="preset-save" disabled>Save</button>
                    <button id="preset-load" disabled>Load</button>
                    <button id="preset-delete">Delete</button>
                </div>
                <p>Save writes the sound now to presets/NAME.brimstone. The plugin's PRESETS screen lists these.</p>
            </section>
        </div>
        <div id="log"></div>
        <script type="module" src="/src/dev.ts"></script>
    </body>
</html>
